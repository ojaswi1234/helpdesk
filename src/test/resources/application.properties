spring.application.name=helpdesk-pro-test

# H2 in PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

helpdesk.attachments.storage-dir=./target/test-uploads/attachments
helpdesk.attachments.max-file-size-bytes=5242880

logging.level.com.helpdesk=INFO
