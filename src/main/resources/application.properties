spring.application.name=helpdesk-pro
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
spring.datasource.username=${DB_USERNAME:helpdesk_user}
spring.datasource.password=${DB_PASSWORD:helpdesk_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Attachments Configuration
helpdesk.attachments.storage-dir=${ATTACHMENT_DIR:./uploads/attachments}
helpdesk.attachments.max-file-size-bytes=5242880

# Logging
logging.level.com.helpdesk=INFO
logging.level.org.springframework.security=WARN

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=45m
