spring.application.name=helpdesk-pro
server.port=${PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Attachments Configuration
helpdesk.attachments.storage-dir=${ATTACHMENT_DIR:./uploads/attachments}
helpdesk.attachments.max-file-size-bytes=5242880

# Logging
logging.level.com.helpdesk=INFO
logging.level.org.springframework.security=WARN

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=45m
