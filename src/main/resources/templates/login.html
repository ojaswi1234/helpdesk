<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Sign In')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 520px;">
    <div class="text-center mb-4">
        <i class="bi bi-headset text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2 text-dark">HelpDesk Pro</h2>
        <p class="text-muted small">Multi-Tenant Customer Support & SLA Platform</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4 p-4 mb-4">
        <div class="card-body">
            <h4 class="card-title fw-bold mb-3">Sign In</h4>

            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-circle-fill me-1"></i> Invalid credentials or account disabled.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> You have signed out successfully.
            </div>
            <div th:if="${param.registered}" class="alert alert-success py-2 small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> Account created! Sign in to access your organization portal.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Sign In</button>
            </form>

            <div class="text-center mt-3">
                <span class="small text-muted">Customer of an onboarded company? </span>
                <a th:href="@{/register}" class="small text-decoration-none fw-semibold">Register Portal Account</a>
            </div>
        </div>
    </div>

    <!-- Demo Role Credentials Quick Selector -->
    <div class="card shadow-sm border-0 rounded-4 p-3 bg-white">
        <div class="card-body p-1">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="small fw-bold text-secondary"><i class="bi bi-people-fill text-primary me-1"></i> Demo Tenants & Roles</span>
                <span class="badge bg-light text-muted border">1-Click Fill</span>
            </div>
            <div class="d-flex flex-column gap-2">
                <button type="button" class="btn btn-outline-primary btn-sm text-start demo-login-btn" data-u="acme_customer" data-p="Customer@123">
                    <div class="d-flex justify-content-between">
                        <strong>Acme Corp — Customer</strong>
                        <span class="badge bg-primary">Tenant 1</span>
                    </div>
                    <small class="text-muted">User: <code>acme_customer</code> | Pass: <code>Customer@123</code></small>
                </button>
                <button type="button" class="btn btn-outline-info btn-sm text-start demo-login-btn" data-u="acme_agent" data-p="Agent@123">
                    <div class="d-flex justify-content-between">
                        <strong>Acme Corp — Support Agent</strong>
                        <span class="badge bg-info text-dark">Agent</span>
                    </div>
                    <small class="text-muted">User: <code>acme_agent</code> | Pass: <code>Agent@123</code></small>
                </button>
                <button type="button" class="btn btn-outline-success btn-sm text-start demo-login-btn" data-u="star_customer" data-p="Customer@123">
                    <div class="d-flex justify-content-between">
                        <strong>Starlight Logistics — Customer</strong>
                        <span class="badge bg-success">Tenant 2</span>
                    </div>
                    <small class="text-muted">User: <code>star_customer</code> | Pass: <code>Customer@123</code></small>
                </button>
                <button type="button" class="btn btn-outline-dark btn-sm text-start demo-login-btn" data-u="superadmin" data-p="Super@123">
                    <div class="d-flex justify-content-between">
                        <strong>Platform Super Admin</strong>
                        <span class="badge bg-dark">Global</span>
                    </div>
                    <small class="text-muted">User: <code>superadmin</code> | Pass: <code>Super@123</code></small>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll(".demo-login-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.getElementById("username").value = btn.getAttribute("data-u");
            document.getElementById("password").value = btn.getAttribute("data-p");
        });
    });
</script>

</body>
</html>
