<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Register Portal Account')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 520px;">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold mt-2 text-dark">HelpDesk Pro</h2>
        <p class="text-muted small">Register Customer Support Portal Account</p>
    </div>

    <div class="card shadow-sm border-0 rounded-4 p-4">
        <div class="card-body">
            <h4 class="card-title fw-bold mb-3">Portal Registration</h4>

            <div th:if="${registrationError}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${registrationError}">Error</span>
            </div>

            <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Organization</label>
                    <select class="form-select" th:field="*{organizationSlug}" required>
                        <option value="" disabled selected>Select your organization</option>
                        <option th:each="org : ${organizations}" th:value="${org.slug}" th:text="${org.name}">Acme Corp</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <input type="text" class="form-control" th:field="*{username}" placeholder="Username" required>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="e.g. Johnathan Smith" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Work Email</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="name@company.com" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" placeholder="At least 6 characters" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Repeat password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">Register Customer Account</button>
            </form>

            <div class="text-center mt-3">
                <span class="small text-muted">Already registered? </span>
                <a th:href="@{/login}" class="small text-decoration-none fw-semibold">Sign In</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
