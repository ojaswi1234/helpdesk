<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - HelpDesk Pro'">HelpDesk Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- HelpDesk Custom CSS -->
    <link th:href="@{/css/helpdesk.css}" rel="stylesheet">
</head>
<body th:attr="data-org-id=${#authentication != null and #authentication.principal instanceof T(com.helpdesk.service.CustomUserPrincipal) ? #authentication.principal.organizationId : null},data-ticket-id=${ticket != null ? ticket.id : null}">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-helpdesk sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-headset text-warning fs-4"></i>
            <span>HelpDesk<span class="text-warning fw-normal"> Pro</span></span>
            <span class="badge bg-light text-dark ms-2 small"
                  sec:authorize="isAuthenticated()"
                  th:if="${#authentication.principal instanceof T(com.helpdesk.service.CustomUserPrincipal)}"
                  th:text="${#authentication.principal.organizationName}">
                Org
            </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hdNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="hdNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tickets}"><i class="bi bi-ticket-detailed-fill me-1"></i> Tickets</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link" th:href="@{/tickets/create}"><i class="bi bi-plus-circle-fill me-1"></i> New Ticket</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('PLATFORM_ADMIN', 'ORGANIZATION_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/organization}"><i class="bi bi-sliders me-1"></i> SLA & Settings</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('PLATFORM_ADMIN', 'ORGANIZATION_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/audit}"><i class="bi bi-shield-check me-1"></i> Audit Trail</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span id="ws-status-indicator" class="badge bg-secondary" title="Real-Time WebSocket Link">Connecting...</span>

                <div class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li>
                            <span class="dropdown-item-text text-muted small"
                                  th:if="${#authentication.principal instanceof T(com.helpdesk.service.CustomUserPrincipal)}"
                                  th:text="${#authentication.principal.fullName + ' (' + #authentication.principal.role + ')'}">
                            </span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/helpdesk-realtime.js}"></script>
    <div id="toast-container" class="toast-container"></div>
</div>

</body>
</html>
