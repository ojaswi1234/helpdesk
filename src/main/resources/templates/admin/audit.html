<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: html_head('Audit Trail')}"></head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-shield-check text-primary me-2"></i>Tenant Security & Workflow Audit Trail</h2>
            <p class="text-muted small mb-0">Immutable records of ticket workflow changes, security access, and state transitions</p>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">&larr; Dashboard</a>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Log ID</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Resource</th>
                            <th>Resource ID</th>
                            <th>Details</th>
                            <th>Timestamp (UTC)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${auditPage.empty}">
                            <td colspan="7" class="text-center py-4 text-muted">No audit events recorded in this tenant.</td>
                        </tr>
                        <tr th:each="a : ${auditPage.content}">
                            <td class="fw-bold" th:text="${'#LOG-' + a.id}">#LOG-1</td>
                            <td th:text="${a.username}">user</td>
                            <td><span class="badge bg-secondary" th:text="${a.action}">ACTION</span></td>
                            <td class="small" th:text="${a.resourceType}">RESOURCE</td>
                            <td><code th:text="${a.resourceId}">ID</code></td>
                            <td class="small" th:text="${a.details}">Details</td>
                            <td class="small text-muted" th:text="${#temporals.format(a.createdAt, 'dd-MMM-yyyy HH:mm:ss')}">Time</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: scripts}"></div>

</body>
</html>
